name: Development Builds

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
          cache: gradle
      - name: Check 1.16.5 regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload reproducible source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: |
            src
            docs
            tests
            build.gradle
            gradle.properties
            settings.gradle
            gradle
            gradlew
            gradlew.bat
            LICENSE
      - name: Build with the original Gradle wrapper and Java 8 target
        run: bash ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ github.sha }}
          path: build/libs
          if-no-files-found: error
